<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>JNTV | Photo</title>
<meta name="description" content="Photos and latest updates from JNTV.">
<meta name="theme-color" content="#111111">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f5f5;color:#171717;font-family:Manrope,Arial,sans-serif}
header{background:#111;color:#fff;border-bottom:4px solid #c90018}
.header-inner{max-width:1100px;margin:auto;padding:17px 20px;display:flex;align-items:center;justify-content:space-between;gap:15px}
.brand{font-family:"Playfair Display",serif;font-size:29px;font-weight:800;letter-spacing:1px}
.brand span{color:#e00020}
.tagline{font-size:10px;letter-spacing:2px;color:#ccc;margin-top:3px}
.home-link{color:#fff;text-decoration:none;font-size:13px;font-weight:800;border:1px solid #666;padding:9px 14px}
main{max-width:900px;margin:35px auto;padding:0 18px}
.photo-card{background:#fff;border:1px solid #e5e5e5;box-shadow:0 5px 22px rgba(0,0,0,.06)}
.photo-top{padding:20px 22px 14px}
.section-label{font-size:11px;font-weight:800;letter-spacing:2px;color:#c90018;text-transform:uppercase}
h1{font-family:"Playfair Display",serif;font-size:27px;line-height:1.35;margin:9px 0 0}
.photo-frame{background:#111;min-height:220px;display:flex;align-items:center;justify-content:center}
.photo-frame img{display:block;width:100%;max-height:750px;object-fit:contain}
.photo-info{padding:20px 22px 24px}
.category{display:inline-block;background:#f1f1f1;padding:6px 10px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:1px}
.caption{font-size:15px;line-height:1.8;margin:14px 0 20px;color:#333}
.actions{display:flex;flex-wrap:wrap;gap:10px}
.action{border:0;background:#c90018;color:#fff;padding:12px 17px;font-family:Manrope,Arial,sans-serif;font-weight:800;font-size:12px;text-decoration:none;cursor:pointer}
.action.secondary{background:#171717}
.status{text-align:center;padding:55px 15px;color:#555;font-size:14px}
footer{margin-top:45px;background:#111;color:#bbb;text-align:center;padding:25px 15px;font-size:11px;letter-spacing:1px}
footer strong{color:#fff}
@media(max-width:600px){
 .header-inner{padding:14px}
 .brand{font-size:24px}
 main{margin:20px auto;padding:0 10px}
 .photo-top{padding:17px}
 h1{font-size:23px}
 .photo-info{padding:17px}
}
</style>
</head>

<body>
<header>
  <div class="header-inner">
    <div>
      <div class="brand">JNTV<span> NEWS</span></div>
      <div class="tagline">INFORM • ENTERTAIN • EMPOWER</div>
    </div>
    <a class="home-link" href="https://jamesnyarangotv.github.io/">VISIT WEBSITE</a>
  </div>
</header>

<main>
  <div class="photo-card" id="photoCard" style="display:none">
    <div class="photo-top">
      <div class="section-label">JNTV PHOTO STORY</div>
      <h1 id="photoTitle">Loading photo...</h1>
    </div>

    <div class="photo-frame">
      <img id="photoImage" src="" alt="JNTV photo" />
    </div>

    <div class="photo-info">
      <span class="category" id="photoCategory">JNTV NEWS</span>
      <p class="caption" id="photoCaption"></p>

      <div class="actions">
        <button class="action" id="shareButton" type="button">SHARE PHOTO</button>
        <a class="action secondary" href="https://jamesnyarangotv.github.io/">MORE NEWS</a>
      </div>
    </div>
  </div>

  <div class="status" id="loading">Loading JNTV photo...</div>
</main>

<footer>
  <strong>JNTV</strong><br><br>
  INFORM • ENTERTAIN • EMPOWER<br><br>
  © <span id="year"></span> JNTV. All Rights Reserved.
</footer>

<script>
const SUPABASE_URL = "https://eqogivrposfajrkdwqbq.supabase.co";
const SUPABASE_KEY = "sb_publishable_l4sKYCzUW6670QvOMtBE_Q_kRCbwDZ-";
const SMART_WORKER_URL = SUPABASE_URL + "/functions/v1/smart-worker";

const params = new URLSearchParams(window.location.search);
const photoId = params.get("id");

document.getElementById("year").textContent = new Date().getFullYear();

function showError(message) {
  document.getElementById("loading").textContent = message;
}

async function loadPhoto() {
  if (!photoId) {
    showError("No photo was specified. Please return to the JNTV website.");
    return;
  }

  try {
    const endpoint = new URL(SUPABASE_URL + "/rest/v1/election_gallery");
    endpoint.searchParams.set("id", "eq." + photoId);
    endpoint.searchParams.set("select", "id,image_url,caption,category,is_active");
    endpoint.searchParams.set("limit", "1");

    const response = await fetch(endpoint.toString(), {
      headers: {
        "apikey": SUPABASE_KEY,
        "Authorization": "Bearer " + SUPABASE_KEY
      }
    });

    if (!response.ok) {
      throw new Error("Unable to retrieve the photo.");
    }

    const rows = await response.json();

    if (!rows.length || rows[0].is_active === false) {
      showError("This photo is unavailable or has been removed.");
      return;
    }

    const photo = rows[0];

    if (!photo.image_url) {
      showError("The photo image could not be found.");
      return;
    }

    const caption = photo.caption || "Photo from JNTV";
    const category = photo.category || "JNTV NEWS";

    document.getElementById("photoImage").src = photo.image_url;
    document.getElementById("photoImage").alt = caption;
    document.getElementById("photoTitle").textContent = caption;
    document.getElementById("photoCaption").textContent = caption;
    document.getElementById("photoCategory").textContent = category;

    document.title = caption + " | JNTV";

    document.getElementById("loading").style.display = "none";
    document.getElementById("photoCard").style.display = "block";

    document.getElementById("shareButton").addEventListener("click", async () => {
      const shareLink = SMART_WORKER_URL +
        "?id=" + encodeURIComponent(photo.id) + "&type=photo";

      if (navigator.share) {
        try {
          await navigator.share({
            title: caption,
            text: caption,
            url: shareLink
          });
        } catch (error) {
          if (error.name !== "AbortError") {
            await copyShareLink(shareLink);
          }
        }
      } else {
        await copyShareLink(shareLink);
      }
    });

  } catch (error) {
    console.error(error);
    showError("We could not load this photo. Please try again later.");
  }
}

async function copyShareLink(link) {
  try {
    await navigator.clipboard.writeText(link);
    alert("JNTV photo sharing link copied. You can now share it on WhatsApp.");
  } catch (error) {
    prompt("Copy this JNTV photo link:", link);
  }
}

loadPhoto();
</script>
</body>
</html>
