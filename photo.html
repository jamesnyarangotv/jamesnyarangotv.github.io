<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>JNTV | Photo News</title>

<meta name="description" content="JNTV - Inform, Entertain, Empower.">

<meta property="og:type" content="article">
<meta property="og:site_name" content="JNTV">
<meta property="og:title" content="JNTV | Kenya Politics">
<meta property="og:description" content="Latest political photographs and news from JNTV.">
<meta property="og:image" content="https://i.imgur.com/9Ok16Sv.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:url" content="https://jamesnyarangotv.github.io/photo.html">

<meta name="twitter:card" content="summary_large_image">

<style>
*{box-sizing:border-box}
body{
 margin:0;
 background:#f2f3f5;
 color:#17212b;
 font-family:Arial,sans-serif;
}
header{
 background:#101820;
 color:white;
 padding:18px 5%;
 border-bottom:4px solid #c90019;
}
.logo{
 font-size:25px;
 font-weight:900;
 letter-spacing:1px;
}
.logo span{color:#e00020}
.tagline{
 font-size:10px;
 letter-spacing:2px;
 margin-top:5px;
 color:#ddd;
}
main{
 max-width:850px;
 margin:30px auto;
 padding:0 15px;
}
.card{
 background:white;
 border:1px solid #e0e3e6;
 border-radius:5px;
 overflow:hidden;
}
.photo{
 width:100%;
 display:block;
 height:auto;
}
.content{padding:23px}
.category{
 color:#c90019;
 font-size:11px;
 font-weight:bold;
 letter-spacing:1px;
}
h1{
 font-family:Georgia,serif;
 font-size:25px;
 line-height:1.35;
 margin:12px 0;
}
.caption{
 font-size:16px;
 line-height:1.8;
 color:#404b55;
}
footer{
 background:#101820;
 color:white;
 padding:22px;
 text-align:center;
 font-size:12px;
 margin-top:35px;
}
footer strong{color:#ff334b}
</style>
</head>

<body>
<header>
 <div class="logo">JNTV<span> NEWS</span></div>
 <div class="tagline">INFORM • ENTERTAIN • EMPOWER</div>
</header>

<main>
 <div class="card">
  <img id="photo" class="photo" alt="JNTV news photograph">

  <div class="content">
   <div class="category" id="category">JNTV PHOTO NEWS</div>
   <h1 id="caption">Loading photograph...</h1>
   <p class="caption">
    Follow JNTV for the latest political news,
    current affairs and developments from Kenya,
    Uganda, Africa and around the world.
   </p>
   <a href="https://jamesnyarangotv.github.io/"
      style="color:#c90019;font-weight:bold">
      VISIT JNTV WEBSITE →
   </a>
  </div>
 </div>
</main>

<footer>
 <strong>JNTV</strong><br>
 INFORM • ENTERTAIN • EMPOWER<br><br>
 © JNTV NEWS
</footer>

<script>
const SUPABASE_URL =
'https://eqogivrposfajrkdwqbq.supabase.co';

const SUPABASE_KEY =
'sb_publishable_l4sKYCzUW6670QvOMtBE_Q_kRCbwDZ-';

const params=new URLSearchParams(location.search);
const id=params.get('id');

async function loadPhoto(){
 if(!id){
  document.getElementById('caption').textContent=
  'Photograph not found.';
  return;
 }

 try{
  const url=SUPABASE_URL+
  '/rest/v1/election_gallery?id=eq.'+
  encodeURIComponent(id)+
  '&select=image_url,caption,category';

  const response=await fetch(url,{
   headers:{
    apikey:SUPABASE_KEY,
    Authorization:'Bearer '+SUPABASE_KEY
   }
  });

  if(!response.ok) throw new Error('Photo unavailable');

  const data=await response.json();

  if(!data.length) throw new Error('Photo not found');

  const photo=data[0];

  document.getElementById('photo').src=photo.image_url;
  document.getElementById('caption').textContent=
  photo.caption || 'JNTV Photo News';

  document.getElementById('category').textContent=
  photo.category || 'JNTV PHOTO NEWS';

  document.title=photo.caption+' | JNTV';

 }catch(error){
  document.getElementById('caption').textContent=
  'Unable to load this photograph.';
 }
}

loadPhoto();
</script>
</body>
</html>
