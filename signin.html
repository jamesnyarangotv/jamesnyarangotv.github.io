<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sign In | JAMES NYARANGO TV</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Jost', sans-serif;
    font-size: 18px;
    background: #f3f4f6;
    color: #222;
}

header {
    background: #101010;
    color: white;
    padding: 15px 5%;
    border-bottom: 4px solid #d71920;
}

.brand {
    display: flex;
    align-items: center;
    gap: 15px;
}

.brand img {
    width: 80px;
    height: 70px;
    object-fit: contain;
}

.brand h1 {
    font-size: 25px;
    font-weight: 800;
}

nav {
    background: #171717;
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
}

nav a {
    color: white;
    text-decoration: none;
    padding: 15px;
    font-size: 18px;
    font-weight: 600;
}

nav a:hover {
    background: #d71920;
}

.login-section {
    min-height: 650px;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 45px 20px;
}

.login-card {
    width: 100%;
    max-width: 480px;
    background: white;
    padding: 40px;
    box-shadow: 0 5px 25px #00000012;
    border-top: 5px solid #d71920;
}

.login-card h2 {
    font-size: 30px;
    text-align: center;
    margin-bottom: 10px;
}

.login-card .subtitle {
    text-align: center;
    color: #666;
    margin-bottom: 30px;
    font-size: 18px;
}

.form-group {
    margin-bottom: 20px;
}

.form-group label {
    display: block;
    font-weight: 700;
    margin-bottom: 8px;
}

.form-group input {
    width: 100%;
    padding: 14px;
    font-family: 'Jost', sans-serif;
    font-size: 18px;
    border: 1px solid #ccc;
    outline: none;
}

.form-group input:focus {
    border-color: #d71920;
}

.password-wrapper {
    position: relative;
}

.password-wrapper input {
    padding-right: 85px;
}

.show-password {
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    border: none;
    background: none;
    color: #d71920;
    font-family: 'Jost', sans-serif;
    font-size: 18px;
    font-weight: 700;
    cursor: pointer;
}

.forgot {
    text-align: right;
    margin-bottom: 22px;
}

.forgot a {
    color: #d71920;
    text-decoration: none;
    font-weight: 600;
    cursor: pointer;
}

.login-button {
    width: 100%;
    padding: 15px;
    background: #d71920;
    color: white;
    border: none;
    font-family: 'Jost', sans-serif;
    font-size: 20px;
    font-weight: 800;
    cursor: pointer;
}

.login-button:hover {
    background: #a90f16;
}

.login-button:disabled {
    opacity: .65;
    cursor: not-allowed;
}

.message {
    margin-top: 18px;
    text-align: center;
    font-size: 16px;
    font-weight: 600;
    line-height: 1.6;
    overflow-wrap: anywhere;
}

.back-home {
    display: block;
    text-align: center;
    margin-top: 25px;
    color: #222;
    text-decoration: none;
    font-weight: 600;
}

footer {
    background: #111820;
    color: white;
    border-top: 4px solid #d71920;
    text-align: center;
    padding: 30px 15px;
}

footer h2 {
    font-size: 23px;
    margin-bottom: 8px;
}

footer p {
    font-size: 18px;
    color: #ccc;
    margin-top: 8px;
}

@media(max-width:550px) {
    .brand h1 {
        font-size: 20px;
    }

    .brand img {
        width: 65px;
    }

    .login-card {
        padding: 25px 20px;
    }

    nav a {
        padding: 12px 9px;
    }
}
</style>
</head>

<body>

<header>
    <div class="brand">
        <img src="JAMO%20LOGO.jpeg" alt="JNTV Logo">
        <h1>JAMES NYARANGO TV</h1>
    </div>
</header>

<nav>
    <a href="index.html">HOME</a>
    <a href="pages/latest-news.html">LATEST NEWS</a>
    <a href="pages/politics.html">POLITICS</a>
    <a href="pages/business.html">BUSINESS</a>
    <a href="pages/sports.html">SPORTS</a>
    <a href="pages/entertainment.html">ENTERTAINMENT</a>
    <a href="pages/videos.html">VIDEOS</a>
    <a href="pages/about.html">ABOUT US</a>
</nav>

<main class="login-section">

    <div class="login-card">

        <h2 id="pageTitle">WELCOME BACK</h2>

        <p class="subtitle" id="pageSubtitle">
            Sign in to your JNTV account
        </p>

        <form id="loginForm">

            <div class="form-group">
                <label for="email">Email Address</label>
                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email address"
                    autocomplete="email"
                    required
                >
            </div>

            <div class="form-group" id="loginPasswordGroup">
                <label for="password">Password</label>

                <div class="password-wrapper">
                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >

                    <button
                        type="button"
                        class="show-password"
                        onclick="togglePassword('password', this)">
                        SHOW
                    </button>
                </div>
            </div>

            <div class="forgot" id="forgotLink">
                <a href="#" id="forgotPassword">
                    Forgot Password?
                </a>
            </div>

            <div class="form-group" id="newPasswordGroup" hidden>
                <label for="newPassword">New Password</label>

                <div class="password-wrapper">
                    <input
                        type="password"
                        id="newPassword"
                        placeholder="Enter your new password"
                        minlength="8"
                        autocomplete="new-password"
                    >

                    <button
                        type="button"
                        class="show-password"
                        onclick="togglePassword('newPassword', this)">
                        SHOW
                    </button>
                </div>
            </div>

            <div class="form-group" id="confirmPasswordGroup" hidden>
                <label for="confirmPassword">Confirm New Password</label>
                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm your new password"
                    minlength="8"
                    autocomplete="new-password"
                >
            </div>

            <button type="submit" class="login-button" id="loginButton">
                SIGN IN
            </button>

            <div class="message" id="message" role="status" aria-live="polite"></div>

        </form>

        <a href="index.html" class="back-home">
            ← Back to Homepage
        </a>

    </div>

</main>

<footer>
    <h2>JAMES NYARANGO TV</h2>
    <p>NEWS • CURRENT AFFAIRS • MEDIA</p>
    <p>© 2026 JAMES NYARANGO TV. ALL RIGHTS RESERVED.</p>
</footer>

<script>

// SUPABASE CONNECTION

const SUPABASE_URL = "https://eqogivrposfajrkdwqbq.supabase.co";

const SUPABASE_KEY = "sb_publishable_l4sKYCzUW6670QvOMtBE_Q_kRCbwDZ-";

const db = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

// PAGE ELEMENTS

const loginForm = document.getElementById("loginForm");
const emailInput = document.getElementById("email");
const passwordInput = document.getElementById("password");
const loginButton = document.getElementById("loginButton");
const message = document.getElementById("message");

let recoveryMode = false;

// SHOW OR HIDE PASSWORD

function togglePassword(id, button) {

    const password = document.getElementById(id);

    if (password.type === "password") {
        password.type = "text";
        button.textContent = "HIDE";
    } else {
        password.type = "password";
        button.textContent = "SHOW";
    }
}

// DISPLAY MESSAGES

function showMessage(text, success = false) {

    message.textContent = text;

    message.style.color = success ? "#16803c" : "#d71920";
}

// LOADING BUTTON

function setLoading(loading, text) {

    loginButton.disabled = loading;

    loginButton.textContent = loading
        ? text
        : (recoveryMode ? "UPDATE PASSWORD" : "SIGN IN");
}

// PASSWORD RECOVERY MODE

function activateRecoveryMode() {

    recoveryMode = true;

    document.getElementById("pageTitle").textContent =
        "RESET YOUR PASSWORD";

    document.getElementById("pageSubtitle").textContent =
        "Create a new password for your JNTV account.";

    document.getElementById("loginPasswordGroup").hidden = true;
    document.getElementById("forgotLink").hidden = true;

    passwordInput.required = false;

    document.getElementById("newPasswordGroup").hidden = false;
    document.getElementById("confirmPasswordGroup").hidden = false;

    document.getElementById("newPassword").required = true;
    document.getElementById("confirmPassword").required = true;

    loginButton.textContent = "UPDATE PASSWORD";

    showMessage("Enter your new password below.", true);
}

// CHECK SUPABASE PASSWORD RECOVERY EVENT

db.auth.onAuthStateChange((event, session) => {

    if (event === "PASSWORD_RECOVERY" && session) {
        activateRecoveryMode();
    }

});

// SIGN IN OR UPDATE PASSWORD

loginForm.addEventListener("submit", async function(event) {

    event.preventDefault();

    showMessage("");

    // PASSWORD UPDATE

    if (recoveryMode) {

        const newPassword =
            document.getElementById("newPassword").value;

        const confirmPassword =
            document.getElementById("confirmPassword").value;

        if (newPassword.length < 8) {
            showMessage("Your new password must contain at least 8 characters.");
            return;
        }

        if (newPassword !== confirmPassword) {
            showMessage("Your passwords do not match.");
            return;
        }

        setLoading(true, "UPDATING PASSWORD...");

        try {

            const { error } = await db.auth.updateUser({
                password: newPassword
            });

            if (error) throw error;

            showMessage(
                "Password updated successfully. You can now sign in.",
                true
            );

            await db.auth.signOut();

            recoveryMode = false;

            document.getElementById("pageTitle").textContent =
                "WELCOME BACK";

            document.getElementById("pageSubtitle").textContent =
                "Sign in to your JNTV account";

            document.getElementById("loginPasswordGroup").hidden = false;
            document.getElementById("forgotLink").hidden = false;

            passwordInput.required = true;

            document.getElementById("newPasswordGroup").hidden = true;
            document.getElementById("confirmPasswordGroup").hidden = true;

            document.getElementById("newPassword").required = false;
            document.getElementById("confirmPassword").required = false;

            document.getElementById("newPassword").value = "";
            document.getElementById("confirmPassword").value = "";
            passwordInput.value = "";

            loginButton.textContent = "SIGN IN";

        } catch (error) {

            showMessage(error.message);
            setLoading(false);

        }

        return;
    }

    // NORMAL SIGN IN

    const email = emailInput.value.trim().toLowerCase();

    const password = passwordInput.value;

    if (!email || !password) {
        showMessage("Please enter your email address and password.");
        return;
    }

    setLoading(true, "SIGNING IN...");

    try {

        const { data, error } = await db.auth.signInWithPassword({
            email: email,
            password: password
        });

        if (error) throw error;

        if (!data.session) {
            throw new Error("Login could not be completed. Please try again.");
        }

        showMessage("Login successful. Welcome to JNTV!", true);

        loginButton.textContent = "SUCCESSFUL";

        window.location.href = "index.html";

    } catch (error) {

        let errorMessage = error.message;

        if (
            error.message.toLowerCase().includes("email not confirmed")
        ) {
            errorMessage =
                "Please confirm your email address before signing in. Check your inbox.";
        }

        showMessage(errorMessage);

        setLoading(false);

    }

});

// FORGOT PASSWORD

document.getElementById("forgotPassword")
.addEventListener("click", async function(event) {

    event.preventDefault();

    const email = emailInput.value.trim().toLowerCase();

    if (!email) {

        showMessage("Please enter your email address first.");

        emailInput.focus();

        return;
    }

    showMessage("");

    this.style.pointerEvents = "none";

    try {

        const { error } = await db.auth.resetPasswordForEmail(email, {
            redirectTo:
                "https://jamesnyarangotv.github.io/signin.html"
        });

        if (error) throw error;

        showMessage(
            "Password recovery instructions have been sent. Please check your email.",
            true
        );

    } catch (error) {

        showMessage(error.message);

    } finally {

        this.style.pointerEvents = "auto";

    }

});

</script>

</body>
